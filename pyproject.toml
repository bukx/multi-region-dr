[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-region-dr"
version = "0.1.0"
description = "Local DR drill simulator for active-passive AWS architectures"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    "pre-commit>=4,<5",
    "ruff>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
pretty = true
show_error_codes = true
warn_unused_configs = true
